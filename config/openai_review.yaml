# openai_review.yaml
# OpenAI 及兼容接口图表复评配置（相对路径基于项目根目录）

# 候选列表 JSON
candidates: data/candidates/candidates_latest.json

# 候选图表目录（其下按 pick_date 分目录）
kline_dir: data/kline

# 评分结果输出目录
output_dir: data/review

# 提示词文件
prompt_path: agent/prompt.md

# OpenAI 模型名称
# 常用模型：
#   - OpenAI: gpt-4o, gpt-4-turbo, gpt-3.5-turbo
#   - DeepSeek: deepseek-chat, deepseek-vision
#   - Qwen (通义千问): qwen-vl-max, qwen-vl-plus
#   - Moonshot (Kimi): moonshot-v1-8k, moonshot-v1-32k
model: kimi-k2.5

# OpenAI 兼容接口地址（可选）
# 留空则使用 OpenAI 官方接口
# 示例：
#   DeepSeek: https://api.deepseek.com/v1
#   Qwen (阿里云): https://dashscope.aliyuncs.com/compatible-mode/v1
#   Moonshot: https://api.moonshot.cn/v1
#   Ollama 本地部署：http://localhost:11434/v1
base_url: https://api.moonshot.cn/v1

# 相邻 API 调用间隔（秒）
request_delay: 5

# true: 跳过已存在单股 JSON（断点续跑）
skip_existing: true

# 推荐最小分数门槛
suggest_min_score: 4.0

# 多线程并发数（默认 5，根据 API 限流调整）
max_workers: 6
